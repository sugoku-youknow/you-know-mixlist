<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ミックスリスト</title>
<meta name="theme-color" content="#1b3a28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--el:#181818;--el2:#1f1f1f;--el3:#2a2a2a;--hi:#3e3e3e;--tx:#fff;--sub:#b3b3b3;--mut:#727272;--g:#1ed760;--g2:#1db954}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Noto Sans JP",system-ui,-apple-system,"Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.hide{display:none!important}

/* ヘッダー */
.top{background:linear-gradient(180deg,#1b3a28 0%,#15241b 55%,var(--bg) 100%);padding-top:env(safe-area-inset-top)}
.hd{display:flex;align-items:center;justify-content:space-between;height:60px}
.brand{display:flex;align-items:center;gap:8px;font-weight:900;font-size:19px;letter-spacing:-.02em}
.brand svg{width:26px;height:26px}
.acct{display:flex;align-items:center;gap:6px;height:32px;padding:0 12px 0 4px;border-radius:99px;background:#000a;font-size:13px;font-weight:700;color:var(--sub)}
.acct i{width:24px;height:24px;border-radius:50%;background:var(--el3);display:grid;place-items:center}
.acct i svg{width:14px;height:14px;fill:var(--sub)}
.acct.on{color:var(--tx)}
.acct.on i{background:var(--g2)}
.acct.on i svg{fill:#000}

section{padding:18px 0 6px}
h2{font-size:22px;font-weight:900;letter-spacing:-.02em;margin:0 0 14px}
.lab{font-size:13px;font-weight:700;color:var(--sub);margin:18px 0 8px}
.filt{margin-top:10px}
.tog{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 8px;border-radius:99px;background:#0006;font-size:13px;font-weight:700;color:var(--sub)}
.tog i{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--mut);display:grid;place-items:center}
.tog.on{color:var(--tx)}
.tog.on i{background:var(--g);border-color:var(--g)}
.tog.on i::after{content:"";width:8px;height:4px;border:2px solid #000;border-top:0;border-right:0;transform:translateY(-1px) rotate(-45deg)}
h2+.lab{margin-top:0}

/* 検索 */
.search{display:flex;align-items:center;gap:10px;background:#fff;color:#000;border-radius:99px;height:46px;padding:0 16px}
.search svg{width:20px;height:20px;flex:none;fill:#121212}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;font:inherit;font-size:16px;color:#000}
.search input::placeholder{color:#555}
.search input::-webkit-search-cancel-button{-webkit-appearance:none}
.res{margin-top:6px}
.ritem{display:flex;align-items:center;gap:12px;padding:8px 6px;margin:0 -6px;border-radius:6px;cursor:pointer}
.ritem:hover{background:var(--el3)}
.ritem img{width:52px;height:52px;border-radius:50%;object-fit:cover;background:var(--el3);flex:none}
.ritem .nm{flex:1;min-width:0}
.ritem .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .nm small{font-size:13px;color:var(--sub)}
.ritem .add{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut);display:grid;place-items:center;flex:none}
.ritem .add svg{width:14px;height:14px;fill:var(--sub)}
.ritem.got .add{background:var(--g);border-color:var(--g)}
.ritem.got .add svg{fill:#000}
.empty{color:var(--sub);font-size:14px;padding:10px 0}

/* 選んだアーティスト */
.picks{display:flex;gap:14px;overflow-x:auto;padding:14px 2px 6px;margin:0 -2px;scrollbar-width:none}
.picks::-webkit-scrollbar{display:none}
.pk{width:84px;flex:none;text-align:center;position:relative}
.pk img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:var(--el3);box-shadow:0 6px 18px #0008;display:block}
.pk span{display:block;font-size:12px;font-weight:700;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pk b{position:absolute;top:0;right:0;width:24px;height:24px;border-radius:50%;background:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 2px 6px #0008}
.pk b svg{width:10px;height:10px;fill:#000}
.picks .empty{padding:2px 0}

/* 設定 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{height:34px;padding:0 14px;border-radius:99px;background:var(--el3);font-size:14px;font-weight:500}
.chips button:hover{background:var(--hi)}
.chips button.on{background:var(--g);color:#000;font-weight:700}
.note{font-size:13px;color:var(--sub);margin:8px 0 0}
.stepper{display:inline-flex;align-items:center;background:var(--el3);border-radius:99px;height:38px}
.stepper button{width:40px;height:38px;border-radius:99px;font-size:20px;color:var(--sub)}
.stepper button:hover{color:var(--tx)}
.stepper span{min-width:52px;text-align:center;font-weight:700}

.gen{display:block;width:100%;height:52px;margin-top:24px;border-radius:99px;background:var(--g);color:#000;font-size:16px;font-weight:900;letter-spacing:.02em}
.gen:hover{background:#3be477}
.gen:active{transform:scale(.98)}
.gen:disabled{background:var(--el3);color:var(--mut);transform:none;cursor:default}
.prog{height:4px;background:var(--hi);border-radius:2px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;background:var(--g);width:0;transition:width .2s}

/* プレイリスト */
#resultCard{margin-top:16px;padding-top:0}
.plhead{display:flex;gap:16px;align-items:flex-end;padding:22px 16px 18px;margin:0 -16px;background:linear-gradient(180deg,#2c4a37 0%,var(--bg) 100%)}
.cover{width:132px;height:132px;flex:none;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 8px 24px #000a;background:var(--el3);overflow:hidden;border-radius:4px}
.cover img{width:100%;height:100%;object-fit:cover;display:block}
.cover.one{grid-template-columns:1fr}
.plmeta{flex:1;min-width:0}
.kicker{font-size:12px;font-weight:700}
.pltitle{width:100%;background:none;border:0;border-bottom:1px solid transparent;color:var(--tx);font:inherit;font-size:24px;font-weight:900;letter-spacing:-.02em;padding:2px 0;outline:0}
.pltitle:focus{border-bottom-color:var(--mut)}
.meta{font-size:13px;color:var(--sub)}
.actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
.save{display:block;width:100%;height:48px;margin-top:10px;border-radius:99px;font-size:15px;background:var(--g);color:#000;font-weight:900}
.save:hover{background:#3be477}
.save:disabled{background:var(--el3);color:var(--mut)}
.pillb{display:flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:99px;border:1px solid var(--mut);font-size:13px;font-weight:700}
.pillb:hover{border-color:#fff}
.pillb svg{width:16px;height:16px;fill:currentColor}
.switch{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--sub);cursor:pointer;margin:4px 0 6px;user-select:none}
.switch input{display:none}
.switch .sw{width:36px;height:20px;border-radius:99px;background:var(--mut);position:relative;transition:background .15s;flex:none}
.switch .sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#000;transition:left .15s}
.switch input:checked+.sw{background:var(--g)}
.switch input:checked+.sw::after{left:18px}
.msg{font-size:13px;color:var(--sub);margin-top:6px}
.msg a,.savedl a{color:var(--g);font-weight:700;text-decoration:none}
.savedl{font-size:13px;color:var(--sub);margin-top:4px}

.tracks{margin-top:10px}
.tr{display:flex;align-items:center;gap:12px;padding:7px 6px;margin:0 -6px;border-radius:6px;cursor:pointer}
.tr:hover{background:var(--el3)}
.tr .no{width:20px;display:flex;justify-content:center;color:var(--sub);font-size:14px;flex:none;font-variant-numeric:tabular-nums}
.tr img{width:46px;height:46px;border-radius:3px;object-fit:cover;background:var(--el3);flex:none}
.tr .nm{flex:1;min-width:0}
.tr .nm b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .nm small{display:block;font-size:13px;color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .du{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;flex:none}
.tr .rm{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;flex:none;opacity:.7}
.tr .rm:hover{opacity:1;background:var(--hi)}
.tr .rm svg{width:12px;height:12px;fill:var(--sub)}
.tr.on .nm b{color:var(--g)}
.eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px}
.eq i{width:3px;background:var(--g);animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:3px}50%{height:14px}}

/* ミニプレイヤー */
.mini{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));max-width:604px;margin:0 auto;background:#1f3a29;border-radius:8px;display:flex;align-items:center;gap:10px;padding:8px;box-shadow:0 8px 24px #000c;z-index:10;overflow:hidden}
.mini img{width:42px;height:42px;border-radius:4px;object-fit:cover;flex:none;background:#000}
.mini .nm{flex:1;min-width:0}
.mini .nm b{display:block;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini .nm small{display:block;font-size:12px;color:#cfd8d2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini button{width:38px;height:38px;display:grid;place-items:center;flex:none}
.mini button svg{width:22px;height:22px;fill:#fff}
.mini .pb{position:absolute;left:8px;right:8px;bottom:2px;height:2px;background:#ffffff40;border-radius:1px}
.mini .pb i{display:block;height:100%;width:0;background:#fff;border-radius:1px}
.mini .tag{font-size:10px;color:#cfd8d2;border:1px solid #cfd8d280;border-radius:3px;padding:0 4px;margin-left:6px;vertical-align:1px}

#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#fff;color:#000;font-weight:500;padding:10px 18px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;z-index:20;text-align:center;box-shadow:0 8px 24px #0009}
#toast.show{opacity:1}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:16px;z-index:30}
.box{background:var(--el2);border-radius:10px;padding:20px;max-width:440px;width:100%}
.box h3{margin:0 0 8px;font-size:18px}
.box input{width:100%;margin-top:12px;height:42px;border-radius:6px;border:1px solid var(--hi);background:var(--el3);color:var(--tx);padding:0 12px;font:inherit}
.box .row{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.box .row button{height:38px;padding:0 18px;border-radius:99px;font-weight:700}
.box .ok{background:var(--g);color:#000}
.box .note b{color:var(--tx);word-break:break-all}
.done{max-width:420px;margin:80px auto;text-align:center;padding:0 16px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap hd">
    <div class="brand"><svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="13" fill="#1ed760"/><rect x="7" y="11" width="2.6" height="8" rx="1.3" fill="#000"/><rect x="11.7" y="7" width="2.6" height="12" rx="1.3" fill="#000"/><rect x="16.4" y="9.5" width="2.6" height="9.5" rx="1.3" fill="#000"/></svg>ミックスリスト</div>
    <button class="acct" id="authPill"><i><svg viewBox="0 0 16 16"><path d="M8 8a3.2 3.2 0 1 0 0-6.4A3.2 3.2 0 0 0 8 8zm0 1.4c-3 0-6 1.5-6 3.6V15h12v-2c0-2.1-3-3.6-6-3.6z"/></svg></i><span id="authTx">ログイン</span></button>
  </div>
  <div class="wrap">
    <section style="padding-top:8px">
      <h2>アーティストを選ぶ</h2>
      <label class="search"><svg viewBox="0 0 24 24"><path d="M10.5 3a7.5 7.5 0 0 1 5.9 12.1l4.8 4.8-1.4 1.4-4.8-4.8A7.5 7.5 0 1 1 10.5 3zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z"/></svg><input type="search" id="q" placeholder="アーティスト名で検索" autocomplete="off" enterkeyhint="search"></label>
      <div class="filt"><button class="tog" id="jpOnly"><i></i>日本のアーティストだけ</button></div>
      <div class="res" id="results"></div>
      <div class="picks" id="myPicks"></div>
    </section>
  </div>
</header>

<main class="wrap">
  <section>
    <div class="lab">アーティストあたりの曲数</div>
    <div class="stepper"><button id="nMinus" aria-label="減らす">−</button><span id="nVal">3曲</span><button id="nPlus" aria-label="増やす">＋</button></div>
    <div class="lab">曲の選び方</div>
    <div class="chips" id="modeSeg">
      <button data-v="top">人気TOP</button>
      <button data-v="toprand">人気曲からランダム</button>
      <button data-v="rand">全曲からランダム</button>
      <button data-v="mix">人気＋ランダム</button>
    </div>
    <div class="lab">並び順</div>
    <div class="chips" id="orderSeg">
      <button data-v="shuffle">シャッフル</button>
      <button data-v="turn">アーティストを交互に</button>
      <button data-v="artist">アーティストごと</button>
    </div>
    <button class="gen" id="btnGen">プレイリストを作る</button>
    <div class="prog hide" id="genProg"><i></i></div>
  </section>

  <section class="hide" id="resultCard">
    <div class="plhead">
      <div class="cover" id="cover"></div>
      <div class="plmeta">
        <div class="kicker">プレイリスト</div>
        <input type="text" id="plTitle" class="pltitle" maxlength="60" placeholder="名前をつける">
        <div class="meta" id="listInfo"></div>
      </div>
    </div>
    <div class="actions">
      <button class="pillb" id="btnShuf"><svg viewBox="0 0 16 16"><path d="M11.5 2.5 14 5l-2.5 2.5V5.8h-1.2c-.8 0-1.3.4-1.8 1l-3.4 4.6c-.7.9-1.6 1.6-3 1.6H1v-1.4h1.1c.8 0 1.3-.4 1.8-1L7.3 6c.7-.9 1.6-1.6 3-1.6h1.2zM1 3.6h1.1c1.4 0 2.3.7 3 1.6l.5.7-.9 1.2-.7-1c-.5-.6-1-1-1.8-1H1zm9.5 6.2.9-.1V8.5L14 11l-2.5 2.5v-1.3h-1.2c-1.4 0-2.3-.7-3-1.6l-.5-.6.9-1.2.7.9c.5.7 1 1.1 1.9 1.1z"/></svg>並べ直す</button>
      <button class="pillb" id="btnRegen"><svg viewBox="0 0 16 16"><path d="M8 2.5a5.5 5.5 0 0 1 5 3.2V3.5h1.5v5h-5V7h2.6A4 4 0 1 0 12 9.6l1.4.5A5.5 5.5 0 1 1 8 2.5z"/></svg>選び直す</button>
    </div>
    <button class="save" id="btnSave">Spotifyに保存</button>
    <div class="prog hide" id="saveProg"><i></i></div>
    <div class="msg" id="saveMsg"></div>
    <div id="savedList"></div>
    <div class="tracks" id="tracks"></div>
  </section>
</main>

<div class="mini hide" id="mini">
  <img id="miniImg" alt="">
  <div class="nm"><b id="miniT"></b><small><span id="miniA"></span><span class="tag">試聴</span></small></div>
  <button id="miniBtn" aria-label="再生・停止"></button>
  <div class="pb"><i id="miniBar"></i></div>
</div>

<div id="toast"></div>

<div class="modal hide" id="cidModal">
  <div class="box">
    <h3>Spotify連携の設定</h3>
    <div class="note">Spotify Developer Dashboard で作ったアプリの Client ID を入れてください（この端末に保存されます）。</div>
    <input type="text" id="cidInput" placeholder="Client ID">
    <div class="note" style="margin-top:10px">Redirect URI に登録するアドレス：<br><b id="cidRedir"></b></div>
    <div class="row">
      <button id="cidCancel">やめる</button>
      <button class="ok" id="cidOk">保存</button>
    </div>
  </div>
</div>

<script>
'use strict';
// ===== 設定 =====
const CLIENT_ID = '34a5d585778344eab3869f782370361c';            // Spotify Developer Dashboard の Client ID（入れればみんな設定不要）
const MOCK = /[?&]mock=1/.test(location.search);   // テスト用：Spotifyを偽物にする
const SCOPES = 'playlist-modify-private playlist-modify-public';
const NET_PREFIX = 'spmix-v1-';
const MAX_ARTISTS = 12;
const COLORS = ['#ff6b8b','#4dc3ff','#ffc94d','#7be07b','#c38bff','#ff9e57','#5ee0d0','#f37bd8'];

// ===== 小物 =====
const $ = s => document.querySelector(s);
const store = (st) => ({
  get(k, d) { try { const v = st.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { st.setItem(k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { st.removeItem(k); } catch (e) {} }
});
const LS = store(window.localStorage), SS = store(window.sessionStorage);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = (n = 10) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const sleep = ms => new Promise(r => setTimeout(r, ms));
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
let toastT;
function toast(msg, ms = 2600) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), ms); }
const fmtFans = n => n >= 1e6 ? (n / 1e6).toFixed(1) + 'M' : n >= 1e3 ? Math.round(n / 1e3) + 'K' : String(n || 0);
function baseTitle(t) {
  return String(t).toLowerCase().normalize('NFKC')
    .replace(/[\(\[【（].*?[\)\]】）]/g, '')
    .replace(/\s+-\s+.*$/, '')
    .replace(/[\s・,.'’!！?？~〜\-]/g, '');
}
const BAD = /\b(live|instrumental|inst\.?|karaoke|off ?vocal|acoustic ver|remix|tv size)\b|ライブ|カラオケ|インスト/i;

// ===== Deezer（ログイン不要の音楽データ） =====
let jpN = 0;
function jsonp(path) {
  return new Promise((res, rej) => {
    const cb = '__dz' + (++jpN) + Date.now().toString(36);
    const s = document.createElement('script');
    const timer = setTimeout(() => { clean(); rej(new Error('timeout')); }, 12000);
    function clean() { clearTimeout(timer); window[cb] = () => {}; s.remove(); }
    window[cb] = d => { clean(); if (d && d.error) { const e = new Error(d.error.message || 'deezer'); e.code = d.error.code; rej(e); } else res(d); };
    s.onerror = () => { clean(); rej(new Error('network')); };
    s.src = 'https://api.deezer.com/' + path + (path.includes('?') ? '&' : '?') + 'output=jsonp&callback=' + cb;
    document.head.appendChild(s);
  });
}
const dzQ = []; let dzActive = 0;
function dz(path) { return new Promise((res, rej) => { dzQ.push({ path, res, rej, tries: 0 }); dzPump(); }); }
function dzPump() {
  while (dzActive < 4 && dzQ.length) {
    const j = dzQ.shift(); dzActive++;
    jsonp(j.path).then(j.res, e => {
      if (e.code === 800 || ++j.tries >= 3) j.rej(e);   // 800 = no data
      else setTimeout(() => { dzQ.push(j); dzPump(); }, 700 * j.tries);
    }).finally(() => { dzActive--; dzPump(); });
  }
}
const dzCache = new Map();
function dzc(path) { if (!dzCache.has(path)) dzCache.set(path, dz(path).catch(e => { dzCache.delete(path); throw e; })); return dzCache.get(path); }

function mkTrack(t, album, pick, by) {
  const al = album || t.album || {};
  return { u: rid(6), id: t.id, t: t.title, a: (t.artist && t.artist.name) || pick.name, aid: pick.id,
    img: al.cover_medium || al.cover_small || pick.img || '', pv: t.preview || '', isrc: t.isrc || '', by, dur: t.duration || 0 };
}
const byArtist = (t, aid) => (t.artist && t.artist.id === aid) || (t.contributors || []).some(c => c.id === aid);
function goodList(list, aid) {
  const seen = new Set(), out = [];
  for (const t of list) {
    if (t.readable === false || !byArtist(t, aid)) continue;
    const k = baseTitle(t.title); if (!k || seen.has(k)) continue;
    seen.add(k); out.push(t);
  }
  const clean = out.filter(t => !BAD.test(t.title));

}
async function topTracks(aid) { const d = await dzc(`artist/${aid}/top?limit=60`); return goodList(d.data || [], aid); }
async function albumsOf(aid) {
  const d = await dzc(`artist/${aid}/albums?limit=100`);
  return (d.data || []).filter(a => a.record_type !== 'compile' && !BAD.test(a.title));
}
async function albumTracks(al) { const d = await dzc(`album/${al.id}/tracks?limit=100`); return d.data || []; }

async function pickRandom(pick, n, exclude) {
  const out = [];
  let albums = shuffle(await albumsOf(pick.id));
  // アルバムを優先（シングルばかりにならないよう重みづけ）
  albums.sort((x, y) => (Math.random() * (x.record_type === 'album' ? 1.6 : 1)) < (Math.random() * (y.record_type === 'album' ? 1.6 : 1)) ? 1 : -1);
  for (let pass = 0; pass < 3 && out.length < n; pass++) {
    for (const al of albums) {
      if (out.length >= n) break;
      let tr;
      try { tr = await albumTracks(al); } catch (e) { continue; }
      const cand = shuffle(tr.filter(t => t.readable !== false && byArtist(t, pick.id) && !BAD.test(t.title) && !exclude.has(baseTitle(t.title))));
      if (!cand.length) continue;
      exclude.add(baseTitle(cand[0].title));
      out.push({ t: cand[0], al });
    }
  }
  return out;
}
async function picksFor(pick, n, mode, by) {

  const fromTop = async (k, randomize) => {
    if (k <= 0) return;
    let list = (await topTracks(pick.id).catch(() => [])).filter(t => !exclude.has(baseTitle(t.title)));
    list = randomize ? shuffle(list.slice(0, Math.max(20, k * 3))) : list;
    for (const t of list.slice(0, k)) { exclude.add(baseTitle(t.title)); res.push(mkTrack(t, null, pick, by)); }
  };
  const fromAll = async k => {
    if (k <= 0) return;
    const r = await pickRandom(pick, k, exclude).catch(() => []);
    for (const x of r) res.push(mkTrack(x.t, x.al, pick, by));
  };

  else if (mode === 'toprand') await fromTop(n, true);
  else if (mode === 'rand') await fromAll(n);

}
function orderTracks(groups, how) {

  if (how === 'artist') return groups.flatMap(([, arts]) => arts.flatMap(([, ts]) => ts));
  if (how === 'turn') {
    const queues = groups.map(([, arts]) => {
      const q = [], lists = arts.map(([, ts]) => ts.slice());
      while (lists.some(l => l.length)) for (const l of lists) if (l.length) q.push(l.shift());
      return q;
    });
    const out = [];
    while (queues.some(q => q.length)) for (const q of queues) if (q.length) out.push(q.shift());

}

async function generate(from) {

  if (!groups.length) { if (from === myPid) toast('アーティストを選んでね'); return; }
  // 同じアーティストを複数人が選んだら1回だけ集めて、曲を選んだ人で分け合う
  const uniq = new Map();

  if (u.pathname === '/me' && m === 'GET') return R(200, { id: 'mockuser', display_name: 'テスト' });
  if (u.pathname === '/search') {
    const lim = +(u.searchParams.get('limit') || 5);
    if (lim > 10) return R(400, { error: { status: 400, message: 'Invalid limit' } });
    const q = u.searchParams.get('q') || '';
    if (q.startsWith('isrc:')) return R(200, { tracks: { items: Math.random() < 0.85 ? [{ uri: 'spotify:track:' + q.slice(5), name: 'x' }] : [] } });

  }

  const pm = u.pathname.match(/^\/playlists\/([^/]+)\/items$/);
  if (pm && m === 'POST') { const b = JSON.parse(init.body); if (!b.uris || b.uris.length > 100) return R(400, { error: { message: 'too many' } }); window.__mockPl.items.push(...b.uris); return R(201, { snapshot_id: 's' }); }

async function togglePlay(tr) {

  if (miniU === tr.u && audio.currentTime > 0 && !audio.ended) { playingU = tr.u; renderTracks(); audio.play().catch(() => {}); return; }
  playingU = tr.u; miniU = tr.u; renderTracks();
  const tryPlay = async src => { audio.src = src; await audio.play(); };
  try { if (!tr.pv) throw 0; await tryPlay(tr.pv); }
  catch (e) {
    try { const d = await dz('track/' + tr.id); if (!d.preview) throw 0; tr.pv = d.preview; if (playingU === tr.u) await tryPlay(d.preview); }
    catch (e2) { if (playingU === tr.u) { playingU = ''; renderTracks(); toast('この曲は試聴できません'); } }
  }
}

  check: '<svg viewBox="0 0 14 14"><path d="M5.2 9.6 12 2.8l1.4 1.4-8.2 8.2L.6 7.8 2 6.4z"/></svg>',
  play: '<svg viewBox="0 0 24 24"><path d="M7 4.5v15l12-7.5z"/></svg>',
  pause: '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"/></svg>'
};
function renderAuth() {

}
function renderPicks() {
  const mine = (S.people[myPid] || {}).artists || [];
  $('#myPicks').innerHTML = mine.length ? mine.map(a =>
    `<div class="pk"><img src="${esc(a.img)}" alt=""><span>${esc(a.name)}</span><b data-del="${a.id}" title="外す">${IC.x}</b></div>`).join('')
    : '<div class="empty">好きなアーティストを検索して追加しよう</div>';

}
const MODE_NOTE = {
  top: '各アーティストの人気ランキング上位から順に選びます（毎回ほぼ同じ曲）',
  toprand: '人気曲の上位から毎回ちがう曲をランダムに選びます',
  rand: 'アルバム・シングル全部からランダムに選びます（隠れた名曲も）',
  mix: '半分は人気曲、半分は全曲からランダムに選びます'
};
function renderSettings() {

  $('#nVal').textContent = s.n + '曲';

  for (const b of $('#orderSeg').children) b.classList.toggle('on', b.dataset.v === s.order);
}
function renderGen() {

  const b = $('#btnGen');
  b.disabled = !!S.busy || !cnt;
  b.textContent = S.busy === 'gen' ? '曲を集めています…' : cnt ? `プレイリストを作る（約${cnt * S.settings.n}曲）` : 'プレイリストを作る';

}
function renderProg() {
  const p = $('#genProg');
  p.classList.toggle('hide', S.busy !== 'gen');

}
function renderResult() {
  const has = S.list.length > 0;
  $('#resultCard').classList.toggle('hide', !has);
  if (!has) return;
  const ti = $('#plTitle'); if (document.activeElement !== ti) ti.value = S.title || '';
  const sec = S.list.reduce((s, t) => s + (t.dur || 0), 0);
  const arts = new Set(S.list.map(t => t.aid)).size;
  $('#listInfo').textContent = `${arts}組のアーティスト・${S.list.length}曲・約${Math.round(sec / 60)}分`;
  // ジャケットを4枚並べた表紙
  const imgs = [...new Set(S.list.map(t => t.img).filter(Boolean))];
  const cv = $('#cover'); cv.classList.toggle('one', imgs.length < 4);
  cv.innerHTML = (imgs.length < 4 ? imgs.slice(0, 1) : imgs.slice(0, 4)).map(u => `<img src="${esc(u)}" alt="">`).join('');
  renderTracks();
  $('#savedList').innerHTML = S.saved.slice().reverse().map(s => `<div class="savedl">保存済み（${s.n}曲） <a href="${esc(s.url)}" target="_blank" rel="noopener">Spotifyで開く ›</a></div>`).join('');
  renderSaveBtn();
}
const fmtDur = s => s ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : '';
function renderTracks() {
  $('#tracks').innerHTML = S.list.map((t, i) => {
    const on = playingU === t.u;
    return `<div class="tr${on ? ' on' : ''}" data-play="${esc(t.u)}"><span class="no">${on ? '<span class="eq"><i></i><i></i><i></i></span>' : i + 1}</span><img src="${esc(t.img)}" alt="" loading="lazy"><div class="nm"><b>${esc(t.t)}</b><small>${esc(t.a)}</small></div><span class="du">${fmtDur(t.dur)}</span><button class="rm" data-rm="${esc(t.u)}" title="外す">${IC.x}</button></div>`;
  }).join('');
  renderMini();
}
function renderMini() {
  const tr = S.list.find(t => t.u === (playingU || miniU));
  const m = $('#mini');
  m.classList.toggle('hide', !tr);
  if (!tr) return;
  $('#miniImg').src = tr.img; $('#miniT').textContent = tr.t; $('#miniA').textContent = tr.a;
  $('#miniBtn').innerHTML = playingU ? IC.pause : IC.play;
}
function renderSaveBtn() {
  const b = $('#btnSave');
  b.disabled = saving || !S.list.length;
  b.textContent = saving ? '保存中…' : getTok() ? 'Spotifyに保存' : 'Spotifyにログインして保存';
}

// 検索
// ひらがな・カタカナ → ローマ字（Deezerは日本のアーティストを英語表記で持っていることが多い）
const KANA = {あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',が:'ga',ぎ:'gi',ぐ:'gu',げ:'ge',ご:'go',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',ざ:'za',じ:'ji',ず:'zu',ぜ:'ze',ぞ:'zo',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',だ:'da',ぢ:'ji',づ:'zu',で:'de',ど:'do',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ば:'ba',び:'bi',ぶ:'bu',べ:'be',ぼ:'bo',ぱ:'pa',ぴ:'pi',ぷ:'pu',ぺ:'pe',ぽ:'po',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'o',ん:'n',ぁ:'a',ぃ:'i',ぅ:'u',ぇ:'e',ぉ:'o',ゔ:'vu'};
function toRomaji(s) {
  const h = String(s).replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  let out = '';
  for (let i = 0; i < h.length; i++) {
    const c = h[i], nx = h[i + 1];
    if (c === 'っ') { const r = KANA[nx] || ''; out += r[0] || ''; continue; }
    if (c === 'ー') continue;
    let r = KANA[c];
    if (r === undefined) { out += c; continue; }
    if (nx && 'ゃゅょ'.includes(nx)) { const v = { 'ゃ': 'a', 'ゅ': 'u', 'ょ': 'o' }[nx]; r = /^(sh|ch|j)/.test(r) ? r.slice(0, -1) + v : r.slice(0, -1) + 'y' + v; i++; }
    out += r;
  }
  return out;
}
const loose = s => String(s).toLowerCase().normalize('NFKC').replace(/[^a-z0-9]/g, '')
  .replace(/c(?!h)/g, 'k').replace(/l/g, 'r').replace(/m(?=[pb])/g, 'n').replace(/ou/g, 'o').replace(/([aiueo])\1+/g, '$1');
const COLLAB = /,|&| \+ |\bfeat\b|\bfeaturing\b| x | × |\bwith\b|\bfrom\b|\bvs\.?\b/i;
function nameMatches(name, q) {
  const n = normT(name), nq = normT(q);
  if (!n || !nq) return false;
  if (n.includes(nq) || (n.length >= 2 && nq.includes(n))) return true;
  const ln = loose(name), lq = loose(/[぀-ヿ]/.test(q) ? toRomaji(q.normalize('NFKC')) : q);
  return lq.length >= 2 && ln.length >= 2 && (ln.includes(lq) || lq.includes(ln));
}
function filterArtists(data, q) {
  const collabQ = COLLAB.test(q);
  // 関係あるもの：名前が合う（ローマ字も見る）か、Deezerが一番に返したもの
  let list = data.filter((a, i) => (collabQ || !COLLAB.test(a.name)) && (i === 0 || nameMatches(a.name, q)));
  // 同じ名前は一番大きいものだけ（LISA と LiSA のように大文字小文字が違うのは別人）
  const byName = new Map();
  for (const a of list) { const k = a.name.normalize('NFKC').replace(/\s+/g, ' ').trim(); const o = byName.get(k); if (!o || (a.nb_fan || 0) > (o.nb_fan || 0)) byName.set(k, a); }
  list = [...byName.values()];
  // カナ表記の重複（ヨルシカ ↔ Yorushika）は大きい方だけ
  list = list.filter(a => {
    if (!/[぀-ヿ]/.test(a.name)) return true;
    const r = loose(toRomaji(a.name.normalize('NFKC')));
    return !list.some(b => b !== a && loose(b.name) === r && (b.nb_fan || 0) >= (a.nb_fan || 0));
  });
  // 作品がほとんどない小さな重複アカウントは消す（例：米津玄師 → Kenshi Yonezu だけ残す）
  const maxFan = Math.max(1, ...list.map(a => a.nb_fan || 0));
  if (list.length > 1) list = list.filter(a => !((a.nb_album || 0) < 5 && (a.nb_fan || 0) < maxFan * 0.1) && (a.nb_fan || 0) >= maxFan * 0.005);
  return list;
}
// 日本のアーティストか：人気曲のISRC（曲の国際コード）が JP で始まるか
// ※Deezerは海外曲のタイトルもカタカナに訳すので、文字では判定できない
const jpCache = new Map(LS.get('spmix-jp2', []));
async function isJapanese(a) {
  if (jpCache.has(a.id)) return jpCache.get(a.id);
  try {
    const d = await dzc(`artist/${a.id}/top?limit=60`);
    const own = (d.data || []).filter(t => t.artist && t.artist.id === a.id).slice(0, 2);
    if (!own.length) return /[぀-ヿ一-鿿]/.test(a.name);
    const isrcs = await Promise.all(own.map(t => dzc('track/' + t.id).then(x => x.isrc || '', () => '')));
    const jp = isrcs.some(s => /^JP/i.test(s));
    jpCache.set(a.id, jp);
    LS.set('spmix-jp2', [...jpCache].slice(-400));
    return jp;
  } catch (e) { return true; }
}
let jpOnly = LS.get('spmix-jponly', true);
function renderJp() { $('#jpOnly').classList.toggle('on', jpOnly); }
$('#jpOnly').onclick = () => { jpOnly = !jpOnly; LS.set('spmix-jponly', jpOnly); renderJp(); $('#q').dispatchEvent(new Event('input')); };
renderJp();
let searchT = 0, lastResults = [], searchSeq = 0;
$('#q').addEventListener('input', () => {
  clearTimeout(searchT);
  const q = $('#q').value.trim();
  if (!q) { $('#results').innerHTML = ''; lastResults = []; return; }
  searchT = setTimeout(async () => {
    const seq = ++searchSeq;
    if (!lastResults.length) $('#results').innerHTML = '<div class="empty">検索中…</div>';
    try {
      const d = await dz('search/artist?limit=15&q=' + encodeURIComponent(q));
      if (seq !== searchSeq) return;
      let list = filterArtists(d.data || [], q);
      if (jpOnly) {
        const flags = await Promise.all(list.map(a => isJapanese(a)));
        if (seq !== searchSeq) return;
        list = list.filter((a, i) => flags[i]);
      }
      lastResults = list.slice(0, 6);
      $('#results').innerHTML = lastResults.length ? lastResults.map(a =>
        `<div class="ritem" data-pick="${a.id}"><img src="${esc(a.picture_medium || a.picture_small)}" alt="" loading="lazy"><div class="nm"><b>${esc(a.name)}</b><small>アーティスト・ファン ${fmtFans(a.nb_fan)}</small></div><span class="add"></span></div>`).join('')
        : `<div class="empty">見つかりませんでした。${jpOnly ? '海外のアーティストなら「日本のアーティストだけ」をオフに。' : ''}英語表記でも試してみてね</div>`;
      markResults();
    } catch (e) { if (seq === searchSeq) $('#results').innerHTML = '<div class="empty">検索できませんでした。通信を確認してね</div>'; }
  }, 350);
});
function markResults() {
  const mine = new Set(((S.people[myPid] || {}).artists || []).map(a => a.id));
  for (const el of document.querySelectorAll('[data-pick]')) {
    const got = mine.has(+el.dataset.pick);
    el.classList.toggle('got', got);
    el.querySelector('.add').innerHTML = got ? IC.check : IC.plus;
  }
}

// クリック
document.addEventListener('click', e => {
  const t = e.target.closest('[data-pick],[data-del],[data-rm],[data-play]');
  if (!t) return;
  if (t.dataset.pick) {
    const a = lastResults.find(x => x.id === +t.dataset.pick); if (!a) return;
    const mine = ((S.people[myPid] || {}).artists || []);
    if (mine.some(x => x.id === a.id)) act({ t: 'del', id: a.id });
    else act({ t: 'add', a: { id: a.id, name: a.name, img: a.picture_medium || a.picture_small } });
  } else if (t.dataset.del) act({ t: 'del', id: +t.dataset.del });
  else if (t.dataset.rm) { if (playingU === t.dataset.rm || miniU === t.dataset.rm) { audio.pause(); playingU = ''; miniU = ''; } act({ t: 'rm', u: t.dataset.rm }); }
  else if (t.dataset.play) { const tr = S.list.find(x => x.u === t.dataset.play); if (tr) togglePlay(tr); }
});
$('#miniBtn').onclick = () => { const tr = S.list.find(t => t.u === (playingU || miniU)); if (tr) togglePlay(tr); };
audio.ontimeupdate = () => { $('#miniBar').style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%'; };
$('#nMinus').onclick = () => act({ t: 'set', k: 'n', v: S.settings.n - 1 });
$('#nPlus').onclick = () => act({ t: 'set', k: 'n', v: S.settings.n + 1 });
$('#modeSeg').onclick = e => { const b = e.target.closest('button'); if (b) act({ t: 'set', k: 'mode', v: b.dataset.v }); };
$('#orderSeg').onclick = e => { const b = e.target.closest('button'); if (b) act({ t: 'set', k: 'order', v: b.dataset.v }); };
$('#btnGen').onclick = () => act({ t: 'gen' });
$('#btnRegen').onclick = () => act({ t: 'gen' });
$('#btnShuf').onclick = () => act({ t: 'shuf', force: true });
$('#plTitle').addEventListener('change', () => act({ t: 'title', v: $('#plTitle').value }));
$('#btnSave').onclick = () => saveToSpotify();
$('#authPill').onclick = () => {
  if (getTok()) { if (confirm('Spotifyからログアウトしますか？')) { setTok(null); renderAuth(); renderSaveBtn(); } }
  else spLogin();
};
// Client ID 入力
function openCid() { $('#cidRedir').textContent = redirectUri(); $('#cidInput').value = LS.get('spmix-cid', ''); $('#cidModal').classList.remove('hide'); }
$('#cidCancel').onclick = () => $('#cidModal').classList.add('hide');
$('#cidOk').onclick = () => { LS.set('spmix-cid', $('#cidInput').value.trim()); $('#cidModal').classList.add('hide'); if ($('#cidInput').value.trim()) spLogin(); };
// 別タブでログインが終わったら
window.addEventListener('storage', e => {
  if (e.key === 'spmix-tok' || e.key === 'spmix-tok-mock') { renderAuth(); renderSaveBtn(); if (getTok() && pendingSave) { pendingSave = false; toast('ログインできました'); saveToSpotify(); } }
});

// ===== 起動 =====
(async function boot() {
  if (await handleCallback()) return;
  loadSolo();
  renderAuth(); render();
  if (!MOCK) prepPkce();
  if (resumeSave) { resumeSave = false; setTimeout(saveToSpotify, 500); }
  window.__mix = { S, act, generate, saveToSpotify, picksFor };
})();
</script>
